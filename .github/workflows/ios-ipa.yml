name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'Core/**'
      - 'Tests/**'
      - 'Configuration/**'
      - 'LiveActivityWidget/**'
      - 'WHOOP.xcodeproj/**'
      - 'Scripts/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'lib/nutrition/calc.ts'
      - '.github/workflows/ios-ipa.yml'

concurrency:
  group: iphone-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  device-ipa:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Find standalone project
        id: project
        shell: bash
        run: |
          if [[ -f Package.swift && -d WHOOP.xcodeproj ]]; then
            echo 'directory=.' >> "$GITHUB_OUTPUT"
          elif [[ -f WHOOP-iOS/Package.swift && -d WHOOP-iOS/WHOOP.xcodeproj ]]; then
            echo 'directory=WHOOP-iOS' >> "$GITHUB_OUTPUT"
          else
            echo 'Place the extracted WHOOP-iOS project at the repository root or in WHOOP-iOS/.' >&2
            exit 1
          fi
      - name: Select Xcode with the iOS 26 SDK
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, re
          from pathlib import Path
          candidates = glob.glob('/Applications/Xcode*26*.app/Contents/Developer')
          if not candidates:
              raise SystemExit('Xcode 26 is required to compile and validate the native Liquid Glass implementation.')
          selected = max(candidates, key=lambda p: tuple(map(int, re.findall(r'\d+', Path(p).parents[1].name))))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('DEVELOPER_DIR=' + selected + '\n')
          print('Selected ' + selected)
          PY
      - name: Check build tools
        run: |
          xcodebuild -version
          swift --version
          python3 --version
      - name: Test portable core and package validator
        working-directory: ${{ steps.project.outputs.directory }}
        run: |
          python3 Scripts/validate-nutrition-resource.py
          swift test --parallel
          python3 -m unittest discover -s Scripts/tests -v
      - name: Build real arm64 device application and package
        working-directory: ${{ steps.project.outputs.directory }}
        shell: bash
        run: |
          if bash Scripts/package-ipa-on-mac.sh; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          def escape(value):
              return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          seen = set()
          for log in Path('build').glob('device-build.*/xcodebuild.log'):
              for source, line, column, message in re.findall(r'^(.+\.swift):(\d+):(\d+): error: (.+)$', log.read_text(errors='replace'), re.M):
                  diagnostic = (source, line, column, message)
                  if diagnostic in seen:
                      continue
                  seen.add(diagnostic)
                  try:
                      source = str(Path(source).relative_to(Path.cwd()))
                  except ValueError:
                      pass
                  print(f'::error file={escape(source)},line={line},col={column}::{escape(message)}')
          PY
          exit 1
      - name: Upload unsigned IPA for device signing
        uses: actions/upload-artifact@v4
        with:
          name: WHOOP-unsigned-iphone-ipa
          path: |
            ${{ steps.project.outputs.directory }}/build/WHOOP-unsigned.ipa
            ${{ steps.project.outputs.directory }}/build/WHOOP-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Upload build diagnostics
        if: always() && steps.project.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: WHOOP-build-diagnostics
          path: |
            ${{ steps.project.outputs.directory }}/build/device-build.*/xcodebuild.log
            ${{ steps.project.outputs.directory }}/build/device-build.*/package-check.json
            ${{ steps.project.outputs.directory }}/build/device-build.*/WHOOP.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Capture isolated simulator layout review
        id: visual
        continue-on-error: true
        working-directory: ${{ steps.project.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/visual-review
          xcrun simctl list runtimes -j > build/visual-review/runtimes.json
          SIM_RUNTIME=$(python3 - <<'PYTHON'
          import json
          runtimes = json.load(open('build/visual-review/runtimes.json'))['runtimes']
          ios = [r for r in runtimes if r.get('isAvailable') and r['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-')]
          if not ios:
              raise SystemExit('No available iOS simulator runtime; device IPA remains available.')
          print(max(ios, key=lambda r: tuple(map(int, r['version'].split('.'))))['identifier'])
          PYTHON
          )
          SIM_DEVICE=$(xcrun simctl create "WHOOP isolated layout review" com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro "$SIM_RUNTIME")
          trap 'xcrun simctl shutdown "$SIM_DEVICE" >/dev/null 2>&1 || true; xcrun simctl delete "$SIM_DEVICE" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$SIM_DEVICE"
          xcrun simctl bootstatus "$SIM_DEVICE" -b
          xcodebuild -project WHOOP.xcodeproj -scheme WHOOP -configuration Debug -destination "id=$SIM_DEVICE" -derivedDataPath build/SimulatorReview CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > build/visual-review/simulator-build.log 2>&1
          xcrun simctl install "$SIM_DEVICE" build/SimulatorReview/Build/Products/Debug-iphonesimulator/WHOOP.app
          xcrun simctl status_bar "$SIM_DEVICE" override --time '9:34' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl launch "$SIM_DEVICE" local.whoop.reconstruction
          sleep 4
          xcrun simctl io "$SIM_DEVICE" screenshot build/visual-review/01-first-launch.png
          xcrun simctl terminate "$SIM_DEVICE" local.whoop.reconstruction
          APP_CONTAINER=$(xcrun simctl get_app_container "$SIM_DEVICE" local.whoop.reconstruction data)
          export APP_CONTAINER
          python3 - <<'PYTHON'
          import datetime, json, os, pathlib, plistlib
          container = pathlib.Path(os.environ['APP_CONTAINER'])
          days = []
          for i, (strain, recovery) in enumerate(zip([9.5,10.7,14.5,5.6,9.6,5.3,15.8], [43,29,44,29,54,50,38])):
              date = datetime.datetime(2026,11,3+i,tzinfo=datetime.timezone.utc).isoformat().replace('+00:00','Z')
              days.append(dict(date=date,recovery=recovery,strain=strain,sleepPerformance=33 if i==6 else 75,sleepMinutes=224 if i==6 else 420,sleepNeededMinutes=680 if i==6 else 510,restingHeartRate=58,hrv=122,respiratoryRate=19.7,steps=26783,energyKcal=2886,heartRates=[],source='imported'))
          fixtures = dict(version=1,days=days,activities=[],journal=[],selectedDate=days[-1]['date'],profile=dict(displayName='Layout Review',username='simulator',age='18',whoopAge='22.6',dayStreakOverride=41))
          (container/'Documents').mkdir(exist_ok=True)
          (container/'Documents/whoop-local-data.json').write_text(json.dumps(fixtures))
          preferences = container/'Library/Preferences/local.whoop.reconstruction.plist'
          preferences.parent.mkdir(parents=True,exist_ok=True)
          with preferences.open('wb') as output:
              plistlib.dump({'whoop.setup.completed.v1':True},output)
          PYTHON
          xcrun simctl launch "$SIM_DEVICE" local.whoop.reconstruction
          sleep 5
          xcrun simctl io "$SIM_DEVICE" screenshot build/visual-review/02-home.png
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          Path('build/visual-review/README.md').write_text('# Native iOS layout review\n\nRendered by the actual SwiftUI app in an isolated iPhone 15 Pro simulator. Home uses synthetic measurements seeded only into this disposable simulator. First launch is unseeded. No fixture is added to the production app. Camera hardware and AI provider were not exercised.\n')
          Path('build/visual-review/run.json').write_text(json.dumps({'source':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'device':'iPhone 15 Pro','synthetic_fixture':True},indent=2))
          PYTHON
          EVIDENCE_DIR=$(mktemp -d)
          cp build/visual-review/*.png build/visual-review/README.md build/visual-review/run.json "$EVIDENCE_DIR/"
          REVIEW_WORKTREE=$(mktemp -d)
          git worktree add --detach "$REVIEW_WORKTREE" HEAD
          git -C "$REVIEW_WORKTREE" switch --orphan "visual-review/$GITHUB_RUN_ID"
          cp "$EVIDENCE_DIR/"* "$REVIEW_WORKTREE/"
          git -C "$REVIEW_WORKTREE" add .
          git -C "$REVIEW_WORKTREE" -c user.name='WHOOP layout review' -c user.email='layout-review@users.noreply.github.com' commit -m "Capture native simulator layout at $GITHUB_SHA"
          git -C "$REVIEW_WORKTREE" push origin "HEAD:refs/heads/visual-review/$GITHUB_RUN_ID"
          git worktree remove "$REVIEW_WORKTREE"
      - name: Upload native layout review
        if: always() && steps.project.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: WHOOP-native-layout-review
          path: ${{ steps.project.outputs.directory }}/build/visual-review/
          if-no-files-found: ignore
          retention-days: 7
