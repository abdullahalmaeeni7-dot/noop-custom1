name: Native iOS layout review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'Core/**'
      - 'UITests/**'
      - 'Configuration/**'
      - 'LiveActivityWidget/**'
      - 'WHOOP.xcodeproj/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/ios-layout.yml'

concurrency:
  group: native-layout-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-layout-review:
    runs-on: macos-15-intel
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Find standalone project
        id: project
        shell: bash
        run: |
          if [[ -f Package.swift && -d WHOOP.xcodeproj ]]; then
            echo 'directory=.' >> "$GITHUB_OUTPUT"
          elif [[ -f WHOOP-iOS/Package.swift && -d WHOOP-iOS/WHOOP.xcodeproj ]]; then
            echo 'directory=WHOOP-iOS' >> "$GITHUB_OUTPUT"
          else
            echo 'Place the extracted WHOOP-iOS project at the repository root or in WHOOP-iOS/.' >&2
            exit 1
          fi
      - name: Select Xcode with the iOS 26 SDK
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, re
          from pathlib import Path
          candidates = glob.glob('/Applications/Xcode*26*.app/Contents/Developer')
          if not candidates:
              raise SystemExit('Xcode 26 is required to compile and validate the native Liquid Glass implementation.')
          selected = max(candidates, key=lambda p: tuple(map(int, re.findall(r'\d+', Path(p).parents[1].name))))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('DEVELOPER_DIR=' + selected + '\n')
          print('Selected ' + selected)
          PY
      - name: Capture isolated simulator layout review
        id: visual
        timeout-minutes: 35
        continue-on-error: true
        working-directory: ${{ steps.project.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/visual-review
          xcrun simctl list runtimes -j > build/visual-review/runtimes.json
          SIM_RUNTIME=$(python3 - <<'PYTHON'
          import json
          runtimes = json.load(open('build/visual-review/runtimes.json'))['runtimes']
          ios = [r for r in runtimes if r.get('isAvailable') and r['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-')]
          if not ios:
              raise SystemExit('No available iOS simulator runtime; device IPA remains available.')
          print(max(ios, key=lambda r: tuple(map(int, r['version'].split('.'))))['identifier'])
          PYTHON
          )
          SIM_DEVICE=$(xcrun simctl create "WHOOP isolated layout review" com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro "$SIM_RUNTIME")
          trap 'xcrun simctl shutdown "$SIM_DEVICE" >/dev/null 2>&1 || true; xcrun simctl delete "$SIM_DEVICE" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$SIM_DEVICE"
          xcrun simctl bootstatus "$SIM_DEVICE" -b > build/visual-review/simulator-boot.log 2>&1 &
          BOOT_PID=$!
          if ! xcodebuild -project WHOOP.xcodeproj -scheme WHOOP -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/SimulatorReview ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > build/visual-review/simulator-build.log 2>&1; then
            python3 - <<'PYTHON'
          from pathlib import Path
          lines = Path('build/visual-review/simulator-build.log').read_text(errors='replace').splitlines()
          errors = [line for line in lines if 'error:' in line or 'fatal error:' in line or 'Undefined symbols' in line]
          for line in (errors or lines[-10:])[:12]:
              print('::error::' + line.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYTHON
            exit 1
          fi
          wait "$BOOT_PID"
          xcrun simctl install "$SIM_DEVICE" build/SimulatorReview/Build/Products/Release-iphonesimulator/WHOOP.app
          xcrun simctl status_bar "$SIM_DEVICE" override --time '9:34' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          reference_result=0
          for REVIEW_LANGUAGE in en ar; do
          xcrun simctl uninstall "$SIM_DEVICE" local.whoop.reconstruction
          xcrun simctl install "$SIM_DEVICE" build/SimulatorReview/Build/Products/Release-iphonesimulator/WHOOP.app
          export REVIEW_LANGUAGE
          APP_CONTAINER=$(xcrun simctl get_app_container "$SIM_DEVICE" local.whoop.reconstruction data)
          export APP_CONTAINER
          python3 - <<'PYTHON'
          import datetime, json, os, pathlib, plistlib
          container = pathlib.Path(os.environ['APP_CONTAINER'])
          days = []
          today = datetime.datetime.combine(datetime.date.today(), datetime.time.min, tzinfo=datetime.timezone.utc)
          for i, (strain, recovery) in enumerate(zip([9.5,10.7,14.5,5.6,9.6,5.3,15.8], [43,29,44,29,82,50,38])):
              date = (today - datetime.timedelta(days=6-i)).isoformat().replace('+00:00','Z')
              days.append(dict(date=date,recovery=recovery,strain=strain,sleepPerformance=33 if i==6 else 75,sleepMinutes=224 if i==6 else 420,sleepNeededMinutes=680 if i==6 else 510,restingHeartRate=58,hrv=122,respiratoryRate=19.7,oxygenSaturation=98,skinTemperatureCelsius=33.7,sleepBreakdown=dict(awakeMinutes=25,lightMinutes=100,deepMinutes=70,remMinutes=54,inBedMinutes=249,efficiencyPercent=90,consistencyPercent=76,debtMinutes=60) if i==6 else None,steps=26783,energyKcal=2886,heartRates=[],source='imported'))
          fixtures = dict(version=1,days=days,activities=[],journal=[],selectedDate=days[-1]['date'],profile=dict(displayName='Alex Avery',username='simulator',age='18',whoopAge='22.6',dayStreakOverride=41))
          (container/'Documents').mkdir(exist_ok=True)
          (container/'Documents/whoop-local-data.json').write_text(json.dumps(fixtures))
          preferences = container/'Library/Preferences/local.whoop.reconstruction.plist'
          preferences.parent.mkdir(parents=True,exist_ok=True)
          with preferences.open('wb') as output:
              plistlib.dump({'whoop.setup.completed.v1':True,'whoop.language.v1':os.environ['REVIEW_LANGUAGE'],'AppleLanguages':[os.environ['REVIEW_LANGUAGE']]},output)
          PYTHON
          xcrun simctl launch "$SIM_DEVICE" local.whoop.reconstruction
          python3 Scripts/capture-stable-simulator.py "$SIM_DEVICE" "build/visual-review/02-home-$REVIEW_LANGUAGE.png"
          xcrun simctl terminate "$SIM_DEVICE" local.whoop.reconstruction
          if [[ "$REVIEW_LANGUAGE" == 'en' ]]; then
            # Populate the real Photos picker without a camera or a network dependency.
            xcrun --sdk macosx swift - App/Resources/whoop-intro.mp4 build/review-photo.jpg <<'SWIFT'
          import AVFoundation
          import ImageIO
          import UniformTypeIdentifiers
          let source = URL(fileURLWithPath: CommandLine.arguments[1])
          let output = URL(fileURLWithPath: CommandLine.arguments[2])
          let generator = AVAssetImageGenerator(asset: AVURLAsset(url: source))
          generator.appliesPreferredTrackTransform = true
          let frame = try generator.copyCGImage(at: CMTime(value: 1, timescale: 1), actualTime: nil)
          guard let destination = CGImageDestinationCreateWithURL(output as CFURL, UTType.jpeg.identifier as CFString, 1, nil) else { exit(1) }
          CGImageDestinationAddImage(destination, frame, nil)
          guard CGImageDestinationFinalize(destination) else { exit(1) }
          SWIFT
            sips -g pixelWidth -g pixelHeight build/review-photo.jpg
            xcrun simctl addmedia "$SIM_DEVICE" build/review-photo.jpg
            xcodebuild test -project WHOOP.xcodeproj -scheme WHOOP -configuration Release -destination "platform=iOS Simulator,id=$SIM_DEVICE" -derivedDataPath build/SimulatorReview -resultBundlePath build/visual-review/reference-features.xcresult -parallel-testing-enabled NO -only-testing:WHOOPUITests/ReferenceFeatureTests ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > build/visual-review/reference-features.log 2>&1 || reference_result=$?
          fi
          xcrun simctl uninstall "$SIM_DEVICE" local.whoop.reconstruction
          xcrun simctl install "$SIM_DEVICE" build/SimulatorReview/Build/Products/Release-iphonesimulator/WHOOP.app
          APP_CONTAINER=$(xcrun simctl get_app_container "$SIM_DEVICE" local.whoop.reconstruction data)
          export APP_CONTAINER
          python3 - <<'PYTHON'
          import os, pathlib, plistlib
          pref = pathlib.Path(os.environ['APP_CONTAINER'])/'Library/Preferences/local.whoop.reconstruction.plist'
          pref.parent.mkdir(parents=True,exist_ok=True)
          with pref.open('wb') as output:
              plistlib.dump({'whoop.language.v1':os.environ['REVIEW_LANGUAGE'],'AppleLanguages':[os.environ['REVIEW_LANGUAGE']]},output)
          PYTHON
          xcrun simctl launch "$SIM_DEVICE" local.whoop.reconstruction
          sleep 4
          xcrun simctl io "$SIM_DEVICE" screenshot "build/visual-review/01-first-launch-$REVIEW_LANGUAGE.png"
          xcrun simctl terminate "$SIM_DEVICE" local.whoop.reconstruction
          done
          xcrun simctl uninstall "$SIM_DEVICE" local.whoop.reconstruction
          if ! xcodebuild test -project WHOOP.xcodeproj -scheme WHOOP -configuration Release -destination "platform=iOS Simulator,id=$SIM_DEVICE" -derivedDataPath build/SimulatorReview -resultBundlePath build/visual-review/setup-flow.xcresult -parallel-testing-enabled NO -only-testing:WHOOPUITests/SetupFlowTests ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > build/visual-review/setup-flow.log 2>&1; then
            tail -60 build/visual-review/setup-flow.log
            echo '::error::Native setup interaction tests failed; see setup-flow.log and the result bundle.'
            exit 1
          fi
          exit "$reference_result"
      - name: Publish simulator evidence and diagnostic status
        if: always() && steps.project.outcome == 'success'
        working-directory: ${{ steps.project.outputs.directory }}
        env:
          CAPTURE_OUTCOME: ${{ steps.visual.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/visual-review
          for entry in "setup-flow:setup" "reference-features:reference"; do
            result="build/visual-review/${entry%:*}.xcresult"
            if [[ -d "$result" ]]; then
              xcrun xcresulttool export attachments --path "$result" --output-path "build/visual-review/${entry#*:}-attachments"
            fi
          done
          python3 - <<'PYTHON'
          import json, re, shutil
          from pathlib import Path
          root = Path('build/visual-review')
          for folder in [root/'setup-attachments', root/'reference-attachments']:
              manifest = folder/'manifest.json'
              if not manifest.exists(): continue
              shutil.copy2(manifest, root/(folder.name + '.json'))
              def entries(value):
                  if isinstance(value, dict):
                      filename = value.get('exportedFileName')
                      name = value.get('suggestedHumanReadableName', '')
                      if filename and str(filename).endswith('.png'):
                          source = folder/filename
                          prefix = re.match(r'^([0-9]{2})-', name)
                          label = prefix.group(1) if prefix else None
                          if label and source.is_file(): shutil.copy2(source, root/f'flow-{label}.png')
                      for item in value.values(): entries(item)
                  elif isinstance(value, list):
                      for item in value: entries(item)
              entries(json.loads(manifest.read_text()))
          PYTHON
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path('build/visual-review')
          log = root/'simulator-build.log'
          lines = log.read_text(errors='replace').splitlines() if log.exists() else []
          for filename in ['reference-features.log', 'setup-flow.log']:
              flow_log = root/filename
              if flow_log.exists(): lines += flow_log.read_text(errors='replace').splitlines()
          errors = [line for line in lines if 'error:' in line or 'Undefined symbols' in line]
          root.joinpath('diagnostics.txt').write_text('\n'.join((errors or lines[-18:])[:24])[:20000] + '\n')
          root.joinpath('run.json').write_text(json.dumps({'source':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'capture_outcome':os.environ['CAPTURE_OUTCOME'],'images':[p.name for p in root.glob('*.png')]},indent=2))
          root.joinpath('README.md').write_text('# Native iOS layout review\n\nCapture outcome: ' + os.environ['CAPTURE_OUTCOME'] + '. Images, when present, are from the actual SwiftUI application in an isolated iPhone simulator. Review measurements are isolated simulator fixtures. Live photo captures use the system photo library, seeded with a still from the supplied intro video. Sensor and camera hardware were not exercised. See run.json and diagnostics.txt for the actual result.\n')
          PYTHON
          EVIDENCE_DIR=$(mktemp -d)
          cp build/visual-review/README.md build/visual-review/run.json build/visual-review/diagnostics.txt "$EVIDENCE_DIR/"
          for EVIDENCE_FILE in build/visual-review/*.png build/visual-review/runtimes.json build/visual-review/setup-attachments.json build/visual-review/reference-attachments.json; do
            if [[ -f "$EVIDENCE_FILE" ]]; then cp "$EVIDENCE_FILE" "$EVIDENCE_DIR/"; fi
          done
          REVIEW_WORKTREE=$(mktemp -d)
          git worktree add --detach "$REVIEW_WORKTREE" HEAD
          git -C "$REVIEW_WORKTREE" switch --orphan "visual-review/$GITHUB_RUN_ID"
          cp "$EVIDENCE_DIR/"* "$REVIEW_WORKTREE/"
          git -C "$REVIEW_WORKTREE" add .
          git -C "$REVIEW_WORKTREE" -c user.name='WHOOP layout review' -c user.email='layout-review@users.noreply.github.com' commit -m "Record native simulator review at $GITHUB_SHA"
          git -C "$REVIEW_WORKTREE" push origin "HEAD:refs/heads/visual-review/$GITHUB_RUN_ID"
          git worktree remove "$REVIEW_WORKTREE"
      - name: Upload native layout review
        if: always() && steps.project.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: WHOOP-native-layout-review
          path: ${{ steps.project.outputs.directory }}/build/visual-review/
          if-no-files-found: ignore
          retention-days: 7
